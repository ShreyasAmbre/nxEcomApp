
<div class="row">
  <h3>{{ categoryName() }}</h3>

  @for (product of categorizedProducts | async; track $index) {
    <div class="col-3">
      <shared-product-card
      [productTitle]="product.title"
      [productDescription]="product.description"
      [productPrice]="product.price"
      [productImg]="product.image"
      />
    </div>
  }
</div>
