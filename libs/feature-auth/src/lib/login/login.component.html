<div class="auth-container d-flex justify-content-center align-items-center">
  <div class="auth-card shadow-lg p-4 rounded-3">
    <h2 class="auth-title mb-3 text-center">Welcome Back</h2>
    <p class="text-center text-muted mb-4">Login to your account</p>

    <form>
      <div class="mb-3">
        <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text bg-white">
            <fa-icon [icon]="['far', 'envelope']"></fa-icon>
          </span>
          <input type="email" class="form-control" placeholder="Enter your email" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text bg-white">
            <fa-icon [icon]="['fas', 'key']"></fa-icon>
          </span>
          <input type="password" class="form-control" placeholder="Enter password" required>
        </div>
      </div>

      <div class="d-flex justify-content-end mb-3">
        <a class="small text-primary fw-semibold" href="javascript:void(0)">Forgot password?</a>
        <!-- TODO: Need to add forgot password flow -->
      </div>

      <button class="btn btn-primary w-100 py-2 fw-semibold mb-3">Login</button>

      <div class="text-center">
        <span class="text-muted">Don't have an account?</span>
        <a class="fw-semibold text-primary" [routerLink]="['../sign-up']">Sign Up</a>
      </div>
    </form>
  </div>
</div>
