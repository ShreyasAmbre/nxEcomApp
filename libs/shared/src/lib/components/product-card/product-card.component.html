<div class="card product-card border-0 shadow-sm rounded-4 overflow-hidden">
  <div class="product-img-wrapper">
    <img
      [src]="productImg() || 'https://via.placeholder.com/300x200'"
      class="card-img-top"
      [alt]="productTitle()"
    />
  </div>

  <div class="card-body">
    <h5 class="card-title fw-semibold mb-1 text-dark">{{ productTitle() | slice: 0:10 }}</h5>
    <p class="card-text text-muted small mb-3">
      {{ productDescription() | slice: 0:60 }}...
    </p>

    <!-- Rating -->
    <div class="mb-3">
      <i class="bi bi-star-fill text-warning"></i>
      <i class="bi bi-star-fill text-warning"></i>
      <i class="bi bi-star-fill text-warning"></i>
      <i class="bi bi-star-half text-warning"></i>
      <i class="bi bi-star text-warning"></i>
      <span class="text-muted small ms-1">(4.3)</span>
    </div>

    <!-- Price & Button -->
    <div class="d-flex justify-content-between align-items-center">
      <span class="fw-bold fs-5 text-success">${{ productPrice() }}</span>
      <button class="btn btn-primary btn-sm px-3 rounded-pill">
        <i class="bi bi-cart-plus me-1"></i> Add to Cart
      </button>
    </div>
  </div>
</div>
